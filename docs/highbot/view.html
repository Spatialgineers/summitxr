<!doctype html><html><body style="margin:0;background:#1a1d22">
<script type="importmap">{"imports":{"three":"http://local/three/build/three.module.js","three/addons/":"http://local/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(900, 900); document.body.appendChild(r.domElement);
r.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(); scene.background = new THREE.Color('#1a1d22');
scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 1.2)); const d = new THREE.DirectionalLight(0xffffff, 2.2); d.position.set(2, 3, 4); scene.add(d);
const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 50);
const gl = new GLTFLoader(); gl.setMeshoptDecoder(MeshoptDecoder);
const glb = new URLSearchParams(location.search).get('glb');
gl.load('http://local/' + glb, (g) => {
  g.scene.traverse((o) => { if (o.isMesh) { o.geometry.computeVertexNormals(); if (o.material) { o.material.flatShading = false; o.material.needsUpdate = true; } } });
  scene.add(g.scene);
  const names = []; g.scene.traverse((o) => { if (o.isMesh) names.push((o.name||'?') + '<' + (o.parent && o.parent.name)); });
  console.log('meshes', names.length);
  window.__shot = (v) => {
    const pos = { front: [0, 1.0, 5.2], side: [5.2, 1.0, 0], back: [0, 1.0, -5.2] }[v];
    cam.position.set(...pos); cam.lookAt(0, 0.9, 0); r.render(scene, cam);
  };
  window.__done = true;
}, undefined, (e) => console.log('load error', e.message || e));
</script></body></html>
